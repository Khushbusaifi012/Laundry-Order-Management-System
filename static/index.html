<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laundry Order Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1a2339;
      --bg-accent:
        radial-gradient(ellipse 900px 520px at 18% -8%, rgba(56, 189, 248, 0.14), transparent 55%),
        radial-gradient(ellipse 800px 480px at 88% 12%, rgba(99, 102, 241, 0.12), transparent 50%),
        radial-gradient(ellipse 700px 400px at 50% 100%, rgba(13, 148, 136, 0.08), transparent 45%);
      --card: #ffffff;
      --card-hover: #fcfcfd;
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(15, 23, 42, 0.08);
      --border-strong: rgba(15, 23, 42, 0.12);
      --accent: #0d9488;
      --accent-hover: #0f766e;
      --accent-glow: rgba(13, 148, 136, 0.25);
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --ok: #15803d;
      --radius: 14px;
      --radius-sm: 10px;
      --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 28px rgba(0, 0, 0, 0.25);
      --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.32);
      --display: "Plus Jakarta Sans", var(--font);
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    @keyframes fade-rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    body {
      margin: 0;
      font-family: var(--font);
      background-color: var(--bg);
      background-image: var(--bg-accent);
      background-attachment: fixed;
      color: var(--text);
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.875rem 1.25rem;
    }
    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    header h1 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    header h1::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    header a {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      transition: color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    header a:hover {
      color: var(--accent);
      border-color: rgba(13, 148, 136, 0.35);
      box-shadow: 0 2px 8px rgba(13, 148, 136, 0.12);
    }
    header a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    main > section {
      animation: fade-rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }
    main > section:nth-child(1) { animation-delay: 0.03s; }
    main > section:nth-child(2) { animation-delay: 0.08s; }
    main > section:nth-child(3) { animation-delay: 0.13s; }
    @media (prefers-reduced-motion: reduce) {
      main > section {
        animation: none;
      }
      section:hover {
        transform: none;
      }
      .stat:hover {
        transform: none;
      }
    }
    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.35rem 1.5rem;
      box-shadow: var(--shadow);
      transition: box-shadow 0.28s ease, border-color 0.28s ease, transform 0.28s ease;
    }
    section:hover {
      box-shadow: var(--shadow-lg);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }
    section h2 {
      margin: 0 0 1.1rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--border);
      font-family: var(--display);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text);
      opacity: 0.88;
    }
    .grid-dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }
    .stat {
      position: relative;
      background: linear-gradient(145deg, #fafafa 0%, #fff 100%);
      border-radius: var(--radius-sm);
      padding: 1rem 1.1rem;
      border: 1px solid var(--border);
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .stat::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), #818cf8);
      opacity: 0.85;
    }
    .stat:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .stat .label {
      font-size: 0.6875rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    .stat .value {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 0.35rem;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }
    .stat-list { font-size: 0.85rem; color: var(--muted); margin-top: 0.35rem; }
    .status-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.4rem;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-family: var(--mono);
      font-size: 0.65rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.32rem 0.55rem;
      border-radius: 999px;
      border: 1px solid transparent;
    }
    .status-pill b {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .status-pill--received {
      background: #f1f5f9;
      color: #475569;
      border-color: #e2e8f0;
    }
    .status-pill--processing {
      background: #eff6ff;
      color: #1d4ed8;
      border-color: #bfdbfe;
    }
    .status-pill--ready {
      background: #fffbeb;
      color: #b45309;
      border-color: #fde68a;
    }
    .status-pill--delivered {
      background: #ecfdf5;
      color: #047857;
      border-color: #a7f3d0;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    input, select {
      font: inherit;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      padding: 0.5rem 0.75rem;
      width: 100%;
      max-width: 100%;
      background: #fff;
      color: var(--text);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input::placeholder { color: #94a3b8; }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.85rem;
      margin-bottom: 0.85rem;
    }
    .items-block {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1rem;
      margin-bottom: 0.85rem;
      background: linear-gradient(180deg, #f8fafc 0%, #fff 100%);
      display: flex;
      flex-direction: column;
    }
    .items-block h3 {
      margin: 0 0 0.65rem;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text);
    }
    #item-rows {
      margin-bottom: 1.25rem;
      padding-bottom: 0.35rem;
    }
    #add-item {
      align-self: flex-start;
    }
    .item-line {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 0.65rem;
      align-items: end;
      margin-bottom: 0.65rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--border);
    }
    .item-line:last-of-type {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0.35rem;
    }
    @media (max-width: 640px) {
      .item-line { grid-template-columns: 1fr 1fr; }
      .item-line button { grid-column: span 2; }
    }
    button {
      cursor: pointer;
      font: inherit;
      border-radius: var(--radius-sm);
      border: none;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.55rem 1rem;
      width: auto;
      transition: background 0.15s ease, transform 0.12s ease, box-shadow 0.15s ease;
    }
    button:active { transform: scale(0.98); }
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button:not(.secondary):not(.danger) {
      background: linear-gradient(180deg, #14b8a6 0%, var(--accent) 100%);
      color: #fff;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.2) inset, 0 2px 8px rgba(13, 148, 136, 0.35);
    }
    button:not(.secondary):not(.danger):hover {
      background: linear-gradient(180deg, #2dd4bf 0%, var(--accent-hover) 100%);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.25) inset, 0 4px 14px rgba(13, 148, 136, 0.4);
    }
    button.secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border-strong);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    button.secondary:hover {
      background: #f8fafc;
      border-color: var(--muted);
    }
    button.danger {
      background: var(--card);
      color: var(--danger);
      border: 1px solid rgba(220, 38, 38, 0.35);
    }
    button.danger:hover { background: var(--danger-bg); border-color: var(--danger); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin-top: 0.65rem; }
    section:has(#create-title) > .actions {
      justify-content: center;
    }
    .orders-filters-row {
      gap: 1rem;
      margin-bottom: 0;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    section:has(#list-title) .orders-filters-row label {
      margin-bottom: 0.5rem;
    }
    section:has(#list-title) > .actions {
      justify-content: center;
      margin-top: 1.35rem;
    }
    section:has(#list-title) > #orders-wrap {
      margin-top: 1.35rem;
    }
    #orders-wrap {
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      overflow: hidden;
      background: var(--card);
      min-height: 2.5rem;
    }
    #orders-wrap > p.small { padding: 1rem 1.25rem; margin: 0; }
    #orders-wrap > div.table-scroll {
      background: var(--card);
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(15, 23, 42, 0.2) transparent;
    }
    #orders-wrap > div.table-scroll::-webkit-scrollbar {
      height: 7px;
    }
    #orders-wrap > div.table-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 999px;
    }
    #orders-wrap > div.table-scroll::-webkit-scrollbar-thumb {
      background: rgba(15, 23, 42, 0.22);
      border-radius: 999px;
    }
    #orders-wrap > div.table-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(15, 23, 42, 0.35);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8125rem;
    }
    #orders-wrap table {
      min-width: 720px;
    }
    #orders-wrap th:first-child,
    #orders-wrap td.mono {
      white-space: nowrap;
    }
    th, td {
      text-align: left;
      padding: 0.65rem 0.75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    tbody tr:last-child td { border-bottom: none; }
    thead th {
      font-family: var(--display);
      color: var(--muted);
      font-weight: 600;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      border-bottom: 1px solid var(--border-strong);
    }
    tbody tr {
      transition: background 0.14s ease, box-shadow 0.14s ease;
    }
    tbody tr:hover td {
      background: #fafbfc;
    }
    tbody tr[data-status="RECEIVED"] td:first-child {
      box-shadow: inset 3px 0 0 #94a3b8;
    }
    tbody tr[data-status="PROCESSING"] td:first-child {
      box-shadow: inset 3px 0 0 #3b82f6;
    }
    tbody tr[data-status="READY"] td:first-child {
      box-shadow: inset 3px 0 0 #f59e0b;
    }
    tbody tr[data-status="DELIVERED"] td:first-child {
      box-shadow: inset 3px 0 0 #10b981;
    }
    .cust-name {
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .td-total {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: #0f766e;
      letter-spacing: -0.02em;
    }
    .cell-actions {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .cell-actions .secondary,
    .cell-actions .danger {
      padding: 0.42rem 0.75rem;
      font-size: 0.8125rem;
    }
    .mono { font-family: var(--mono); font-size: 0.78rem; font-weight: 500; }
    .st-sel {
      padding: 0.4rem 0.55rem !important;
      font-size: 0.8125rem;
      border-radius: 8px !important;
    }
    .msg {
      margin-top: 0.65rem;
      padding: 0.55rem 0.65rem;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .msg.ok { background: #f0fdf4; color: var(--ok); border: 1px solid #86efac; }
    .msg.err { background: var(--danger-bg); color: var(--danger); border: 1px solid #fecaca; }
    .small { font-size: 0.8rem; color: var(--muted); }
    #toast-host {
      position: fixed;
      top: max(1rem, env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: center;
      pointer-events: none;
      width: min(380px, calc(100vw - 2rem));
    }
    .toast {
      pointer-events: auto;
      width: 100%;
      max-width: min(380px, calc(100vw - 2rem));
      padding: 0.85rem 1.1rem;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.35;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      opacity: 0;
      transform: translateY(-12px);
      transition: opacity 0.28s ease, transform 0.28s ease;
    }
    .toast--show {
      opacity: 1;
      transform: translateY(0);
    }
    .toast--ok {
      border-color: #b7dfb8;
      background: #f4fbf4;
      color: var(--ok);
    }
    .toast--err {
      border-color: #fecdca;
      background: #fff8f7;
      color: var(--danger);
    }
    .toast__detail {
      display: block;
      margin-top: 0.35rem;
      font-weight: 500;
      font-size: 0.82rem;
      opacity: 0.92;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>Laundry Order Management System</h1>
      <a href="/docs" target="_blank" rel="noopener">API docs →</a>
    </div>
  </header>
  <main>
    <section aria-labelledby="dash-title">
      <h2 id="dash-title">Dashboard</h2>
      <div class="grid-dashboard" id="dashboard">
        <p class="small">Loading…</p>
      </div>
    </section>

    <section aria-labelledby="create-title">
      <h2 id="create-title">Create order</h2>
      <div class="row">
        <div>
          <label for="cust-name">Customer name</label>
          <input id="cust-name" autocomplete="name" />
        </div>
        <div>
          <label for="cust-phone">Phone</label>
          <input id="cust-phone" type="tel" autocomplete="tel" />
        </div>
        <div>
          <label for="cust-delivery">Estimated delivery (optional)</label>
          <input id="cust-delivery" type="date" />
        </div>
      </div>
      <div class="items-block">
        <h3>Garments</h3>
        <div id="item-rows"></div>
        <button type="button" class="secondary" id="add-item">Add line</button>
      </div>
      <div class="actions">
        <button type="button" id="submit-order">Create order</button>
      </div>
      <div id="create-msg"></div>
    </section>

    <section aria-labelledby="list-title">
      <h2 id="list-title">Orders</h2>
      <div class="row orders-filters-row">
        <div>
          <label for="f-status">Status</label>
          <select id="f-status">
            <option value="">Any</option>
            <option>RECEIVED</option>
            <option>PROCESSING</option>
            <option>READY</option>
            <option>DELIVERED</option>
          </select>
        </div>
        <div>
          <label for="f-name">Customer name contains</label>
          <input id="f-name" placeholder="e.g. Asha" />
        </div>
        <div>
          <label for="f-phone">Phone contains</label>
          <input id="f-phone" placeholder="digits" />
        </div>
        <div>
          <label for="f-garment">Garment contains</label>
          <input id="f-garment" placeholder="e.g. Saree" />
        </div>
      </div>
      <div class="actions">
        <button type="button" id="refresh-orders">Apply filters & refresh</button>
      </div>
      <div id="orders-wrap"></div>
    </section>
  </main>

  <script>
    const api = (path, opts = {}) =>
      fetch(path, {
        headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
        ...opts,
      });

    let toastHideTimer = null;
    function showToast(message, kind, detail) {
      let host = document.getElementById("toast-host");
      if (!host) {
        host = document.createElement("div");
        host.id = "toast-host";
        host.setAttribute("aria-live", "polite");
        document.body.appendChild(host);
      }
      host.querySelectorAll(".toast").forEach((n) => n.remove());
      const t = document.createElement("div");
      t.className = "toast toast--" + (kind === "err" ? "err" : "ok");
      t.appendChild(document.createTextNode(message));
      if (detail) {
        const s = document.createElement("span");
        s.className = "toast__detail";
        s.textContent = detail;
        t.appendChild(s);
      }
      host.appendChild(t);
      requestAnimationFrame(() => t.classList.add("toast--show"));
      clearTimeout(toastHideTimer);
      toastHideTimer = setTimeout(() => {
        t.classList.remove("toast--show");
        setTimeout(() => t.remove(), 320);
      }, 4000);
    }

    function el(html) {
      const t = document.createElement("template");
      t.innerHTML = html.trim();
      return t.content.firstElementChild;
    }

    async function loadDashboard() {
      const box = document.getElementById("dashboard");
      try {
        const r = await api("/dashboard");
        if (!r.ok) throw new Error(await r.text());
        const d = await r.json();
        const per = d.orders_per_status || {};
        const statusPills = Object.entries(per)
          .map(
            ([k, v]) =>
              `<span class="status-pill status-pill--${String(k).toLowerCase()}">${k} <b>${v}</b></span>`
          )
          .join("");
        box.innerHTML = `
          <div class="stat"><div class="label">Total orders</div><div class="value">${d.total_orders}</div></div>
          <div class="stat"><div class="label">Total revenue</div><div class="value">${Number(d.total_revenue).toFixed(2)}</div></div>
          <div class="stat"><div class="label">By status</div><div class="status-pills">${statusPills || "—"}</div></div>
        `;
      } catch (e) {
        box.innerHTML = `<p class="small" style="color:var(--danger)">Could not load dashboard.</p>`;
      }
    }

    function addItemRow(garment = "", qty = 1, price = "") {
      const wrap = document.getElementById("item-rows");
      const row = el(`
        <div class="item-line">
          <div><label>Garment</label><input class="g-garment" value="${garment.replace(/"/g, "&quot;")}" placeholder="Shirt" /></div>
          <div><label>Qty</label><input class="g-qty" type="number" min="1" step="1" value="${qty}" /></div>
          <div><label>Unit price</label><input class="g-price" type="number" min="0" step="0.01" value="${price}" placeholder="80" /></div>
          <div><label>&nbsp;</label><button type="button" class="danger rm">Remove</button></div>
        </div>
      `);
      row.querySelector(".rm").onclick = () => row.remove();
      wrap.appendChild(row);
    }

    document.getElementById("add-item").onclick = () => addItemRow();
    addItemRow("Shirt", 1, 80);
    addItemRow("Pants", 1, 120);

    function showMsg(id, text, ok) {
      const n = document.getElementById(id);
      if (!text) { n.innerHTML = ""; return; }
      n.innerHTML = `<div class="msg ${ok ? "ok" : "err"}">${text}</div>`;
    }

    document.getElementById("submit-order").onclick = async () => {
      const name = document.getElementById("cust-name").value.trim();
      const phone = document.getElementById("cust-phone").value.trim();
      const delivery = document.getElementById("cust-delivery").value;
      const lines = [...document.querySelectorAll("#item-rows .item-line")].map((row) => ({
        garment: row.querySelector(".g-garment").value.trim(),
        quantity: Number(row.querySelector(".g-qty").value),
        unit_price: Number(row.querySelector(".g-price").value),
      })).filter((x) => x.garment);

      if (!name || !phone) {
        showMsg("create-msg", "Customer name and phone are required.", false);
        return;
      }
      if (!lines.length) {
        showMsg("create-msg", "Add at least one garment line.", false);
        return;
      }
      for (const L of lines) {
        if (!Number.isFinite(L.quantity) || L.quantity < 1 || !Number.isFinite(L.unit_price) || L.unit_price < 0) {
          showMsg("create-msg", "Each line needs garment name, quantity ≥ 1, and valid unit price.", false);
          return;
        }
      }

      const body = { customer_name: name, phone, items: lines };
      if (delivery) body.estimated_delivery_date = delivery;

      try {
        const r = await api("/orders", { method: "POST", body: JSON.stringify(body) });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          const detail = data.detail ? JSON.stringify(data.detail) : JSON.stringify(data);
          showMsg("create-msg", `Error: ${detail}`, false);
          return;
        }
        showMsg("create-msg", "", true);
        showToast(
          "Order created successfully",
          "ok",
          `${data.id} · total ${Number(data.total).toFixed(2)} · ${data.status}`
        );
        await loadDashboard();
        await loadOrders();
      } catch (e) {
        showMsg("create-msg", "Network error. Is the API running?", false);
      }
    };

    function fmtItems(items) {
      return items.map((i) => `${i.garment} ×${i.quantity} @ ${i.unit_price}`).join("; ");
    }

    async function loadOrders() {
      const wrap = document.getElementById("orders-wrap");
      const qs = new URLSearchParams();
      const st = document.getElementById("f-status").value;
      const fn = document.getElementById("f-name").value.trim();
      const fp = document.getElementById("f-phone").value.trim();
      const fg = document.getElementById("f-garment").value.trim();
      if (st) qs.set("status", st);
      if (fn) qs.set("customer_name", fn);
      if (fp) qs.set("phone", fp);
      if (fg) qs.set("garment", fg);
      const q = qs.toString();
      wrap.innerHTML = `<p class="small">Loading…</p>`;
      try {
        const r = await api("/orders" + (q ? "?" + q : ""));
        if (!r.ok) throw new Error(await r.text());
        const orders = await r.json();
        if (!orders.length) {
          wrap.innerHTML = `<p class="small">No orders match.</p>`;
          return;
        }
        const rows = orders
          .map((o) => {
            const opts = ["RECEIVED", "PROCESSING", "READY", "DELIVERED"]
              .map((s) => `<option value="${s}" ${o.status === s ? "selected" : ""}>${s}</option>`)
              .join("");
            return `<tr data-id="${o.id}" data-status="${o.status}">
              <td class="mono">${o.id}</td>
              <td><span class="cust-name">${o.customer_name}</span><br/><span class="small">${o.phone}</span></td>
              <td class="small">${fmtItems(o.items)}</td>
              <td class="td-total">${Number(o.total).toFixed(2)}</td>
              <td class="small">${o.estimated_delivery_date || "—"}</td>
              <td><select class="st-sel">${opts}</select></td>
              <td><div class="cell-actions">
                <button type="button" class="secondary save-st">Save</button>
                <button type="button" class="danger del-st">Delete</button>
              </div></td>
            </tr>`;
          })
          .join("");
        wrap.innerHTML = `
          <div class="table-scroll">
            <table>
              <thead><tr>
                <th>ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Est. delivery</th><th>Status</th><th>Actions</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>`;

        wrap.querySelectorAll(".save-st").forEach((btn) => {
          btn.onclick = async () => {
            const tr = btn.closest("tr");
            const id = tr.getAttribute("data-id");
            const sel = tr.querySelector(".st-sel");
            const status = sel.value;
            try {
              const r = await api(`/orders/${encodeURIComponent(id)}/status`, {
                method: "PATCH",
                body: JSON.stringify({ status }),
              });
              if (!r.ok) {
                const err = await r.json().catch(() => ({}));
                const msg = typeof err.detail === "string" ? err.detail : "Update failed";
                showToast("Could not save status", "err", msg);
                return;
              }
              showToast("Status saved", "ok", `${id} → ${status}`);
              await loadDashboard();
              await loadOrders();
            } catch {
              showToast("Network error", "err", "Try again in a moment.");
            }
          };
        });

        wrap.querySelectorAll(".del-st").forEach((btn) => {
          btn.onclick = async () => {
            const tr = btn.closest("tr");
            const id = tr.getAttribute("data-id");
            if (!confirm(`Delete order ${id}? This cannot be undone.`)) return;
            try {
              const r = await fetch(`/orders/${encodeURIComponent(id)}`, { method: "DELETE" });
              if (r.status === 404) {
                showToast("Order not found", "err");
                return;
              }
              if (!r.ok) {
                showToast("Delete failed", "err");
                return;
              }
              showToast("Order deleted", "ok", id);
              await loadDashboard();
              await loadOrders();
            } catch {
              showToast("Network error", "err", "Try again in a moment.");
            }
          };
        });
      } catch {
        wrap.innerHTML = `<p class="small" style="color:var(--danger)">Could not load orders.</p>`;
      }
    }

    document.getElementById("refresh-orders").onclick = () => loadOrders();

    loadDashboard();
    loadOrders();
  </script>
</body>
</html>
