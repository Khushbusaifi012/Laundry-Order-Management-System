# https://render.com/docs/blueprint-spec
databases:
  - name: laundry-oms-db
    databaseName: laundry_oms
    user: laundry_oms

services:
  - type: web
    name: laundry-oms
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: laundry-oms-db
          property: connectionString
